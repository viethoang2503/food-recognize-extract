seed: 42

paths:
  data_root: /content/data/upmc_food101    # extracted dataset on local disk
  work_dir: /content/drive/MyDrive/foodmm  # manifest, runs, results (Google Drive)

data:
  val_ratio: 0.1
  subset_classes: null     # e.g. 5 for a quick smoke run
  max_per_class: null
  max_chars: 5000
  max_drop_ratio: 0.05
  max_bad_images: 50
  text_mask: none          # none | exact | strict
  num_workers: 4

image:
  backbone: resnet50
  pretrained: true
  img_size: 224
  drop_rate: 0.2

text:
  model_name: distilbert/distilbert-base-uncased
  pretrained: true
  max_len: 256
  drop_rate: 0.1

fusion:
  hidden: 512
  dropout: 0.3
  modality_dropout: 0.1
  image_init: image        # run name of the image-only run
  text_init: null          # run name of the text-only run; null -> text_<text_mask>

train:
  image:
    epochs: 10
    batch_size: 64
    lr_backbone: 1.0e-4
    lr_head: 1.0e-3
    weight_decay: 0.05
  text:
    epochs: 4
    batch_size: 32
    lr_backbone: 3.0e-5
    lr_head: 1.0e-3
    weight_decay: 0.01
  multimodal:
    epochs: 4
    batch_size: 32
    lr_image: 3.0e-5
    lr_text: 2.0e-5
    lr_head: 1.0e-3
    weight_decay: 0.01
  warmup_ratio: 0.05
  label_smoothing: 0.1
  grad_clip: 1.0
  patience: 2
  amp: true
  log_every: 100

tfidf:
  max_features: 200000
  ngram_max: 2
  min_df: 2
  C_grid: [1, 5, 20]

late_fusion:
  w_step: 0.05



clip:
  model_name: openai/clip-vit-base-patch16
  tag: vitb16
  batch_size: 256
  n_tokens: 16             # image: 4x4 pooled patch grid; text: 16 contiguous chunks
  fp16: true               # only used on CUDA
  main_mask: strict        # text mask used by the missing/robustness/fraction ablations
  prompt: "a photo of {}, a type of food"
  shard_size: 2048
  corruptions:
    blur: [1, 2, 4]        # Gaussian blur radius (pixels)
    noise: [0.05, 0.1, 0.2]  # Gaussian noise std on [0, 1] pixels
    word_drop: [0.25, 0.5, 0.75]

head:
  name: concat             # image | text | concat | gated | xattn
  hidden: 512
  dropout: 0.3
  modality_dropout: 0.1
  default_modality_dropout: 0.1
  train_frac: 1.0
  epochs: 30
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 0.01
  warmup_ratio: 0.05
  label_smoothing: 0.1
  patience: 3
  xattn_dim: 256
  xattn_heads: 4
  xattn_layers: 1

clip_suite:
  masks: [none, strict]
  fusion_heads: [concat, gated, xattn]

stats:
  n_boot: 1000
  alpha: 0.05
  pairs:                   # [a, b] run dirs relative to paths.work_dir; diff = acc(b) - acc(a)
    - [clip/runs/image, clip/runs/text_strict]
    - [clip/runs/image, clip/runs/xattn_strict]
    - [clip/runs/text_strict, clip/runs/xattn_strict]
    - [clip/runs/late_strict, clip/runs/xattn_strict]
    - [clip/runs/late_strict, clip/runs/concat_strict]
    - [clip/runs/late_strict, clip/runs/gated_strict]
    - [clip/runs/concat_strict, clip/runs/xattn_strict]
    - [clip/runs/gated_strict, clip/runs/xattn_strict]
    - [clip/runs/zeroshot, clip/runs/image]
    - [runs/image, runs/early_strict]
    - [runs/text_strict, runs/early_strict]
    - [runs/late_strict, runs/early_strict]
    - [runs/early_strict, clip/runs/xattn_strict]

vlm:
  model_name: Qwen/Qwen3-VL-4B-Instruct   # Qwen/Qwen3-VL-8B-Instruct also works
  tag: qwen3vl4b                          # output folder name under work_dir/vlm/
  backend: hf                             # hf | fake (tests only)
  quantize: auto                          # auto: bf16 on compute capability >= 8 (L4/A100), else 4-bit
  allow_cpu: false                        # true only for tests with a tiny model
  max_new_tokens: 256
  max_image_side: 768
  n_samples: 200
  text_mask: strict                       # text given to the text and image_text modes
  max_context_chars: 1000
  match_threshold: 0.6
  n_grading: 20
  n_boot: 1000                            # bootstrap resamples for the dish-accuracy CI
  compare_runs:                           # classifiers scored on the same sample ids (relative to paths.work_dir)
    image: clip/runs/image
    text: clip/runs/text_strict
    image_text: clip/runs/xattn_strict
  log_every: 20

demo:
  text_mask: strict        # user text is cleaned and masked like the training data of the heads
  image_run: image
  text_run: null           # null -> text_<demo.text_mask>
  fusion_run: xattn_strict # a Milestone 2 head run (trained with modality dropout)
  top_k: 5
  n_examples: 8
  vlm: true                # show the VLM checkbox
  server_port: 7860
